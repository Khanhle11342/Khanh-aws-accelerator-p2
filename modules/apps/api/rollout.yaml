apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: w9-api:1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ERROR_RATE
              value: "0"
            - name: VERSION
              value: "v3"
            - name: DB_SECRET_FILE
              value: /var/run/app-secrets/db_pass
          volumeMounts:
            - name: db-credentials
              mountPath: /var/run/app-secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
      volumes:
        - name: db-credentials
          secret:
            secretName: api-db-credentials
            optional: true
  strategy:
    canary:
      steps:
        - setWeight: 100
