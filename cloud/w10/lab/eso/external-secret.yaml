apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-db-credentials
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: eso-k8s-store
    kind: SecretStore
  target:
    name: api-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: db_pass
      remoteRef:
        key: eso-source-db
        property: db_pass
