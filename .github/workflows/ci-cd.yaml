name: CI/CD - Build Push Update GitOps

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-push-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/web" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Push Docker image
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Update GitOps manifest image
        run: |
          sed -i "s|image: .*|image: ${IMAGE_NAME}:${IMAGE_TAG}|g" gitops/apps/web/deployment.yaml

      - name: Commit and push GitOps update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/apps/web/deployment.yaml
          git commit -m "ci: update web image to ${IMAGE_TAG}" || echo "No changes to commit"
          git push
