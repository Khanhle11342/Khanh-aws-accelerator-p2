name: CI/CD - Build Push Update GitOps

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  build-push-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/web" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push Docker image
        run: |
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign image with Cosign keyless
        run: |
          cosign sign --yes "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Verify image signature
        run: |
          cosign verify "${IMAGE_NAME}:${IMAGE_TAG}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci-cd.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Update GitOps manifest image
        run: |
          sed -i "s|image: .*|image: ${IMAGE_NAME}:${IMAGE_TAG}|g" modules/apps/web/deployment.yaml

      - name: Commit and push GitOps update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add modules/apps/web/deployment.yaml
          git commit -m "ci: update web image to ${IMAGE_TAG}" || echo "No changes to commit"
          git push
